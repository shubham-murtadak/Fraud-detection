[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard"
version = "0.1.0"
description = "Production-style fraud detection platform"
authors = [{ name = "Data Scientist" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "pandera>=0.16.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mangum>=0.17.0",
    "pydantic>=2.0.0",
    "kaggle>=1.5.16",
    "shap>=0.42.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "jupyter>=1.0.0"
]
